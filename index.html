<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียน LINE รายวิชา</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Sarabun', sans-serif; background: #f4f6f8; color: #222; }
    .card { max-width: 420px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 4px; color: #06C755; }
    .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    .profile { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .profile img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #eee; }
    label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 15px; }
    input { width: 100%; padding: 14px; font-size: 20px; letter-spacing: 1px; font-family: inherit; border: 1px solid #ccc; border-radius: 10px; }
    button { width: 100%; margin-top: 22px; padding: 14px; font-size: 17px; font-family: inherit; font-weight: 600; color: #fff; background: #06C755; border: 0; border-radius: 10px; }
    button:disabled { background: #9adbb5; }
    .msg { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 15px; display: none; }
    .msg.ok { display: block; background: #e7f9ee; color: #087a3a; }
    .msg.err { display: block; background: #fdecec; color: #b42318; }
    .note { margin-top: 4px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ลงทะเบียน LINE รายวิชา</h1>
    <div class="sub">สำหรับตรวจสอบกิจกรรมในรายวิชา</div>

    <div class="profile">
      <img id="pic" alt="">
      <div><div id="name">กำลังโหลด...</div><div class="note" id="status"></div></div>
    </div>

    <form id="form">
      <label for="studentId">รหัสนักศึกษา</label>
      <input id="studentId" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
      <button id="btn" type="submit" disabled>ลงทะเบียน</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

<script>
  // ====== ตั้งค่า ======
  const LIFF_ID = '2011989508-GtiF91k9';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzW-DJnxlGJiR72dntge9H74haVGDoP78ZYSnjRoTSSirl1rEWC8jENO6qE62cBCkv1nw/exec';

  const $ = id => document.getElementById(id);
  let idToken = '';

  function showMsg(text, ok) {
    $('msg').className = 'msg ' + (ok ? 'ok' : 'err');
    $('msg').textContent = text;
  }

  async function api(body) {
    // ไม่ใส่ headers → ส่งเป็น text/plain เพื่อเลี่ยงปัญหา CORS กับ Apps Script
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ ...body, idToken }) });
    const data = await res.json();
    if (data.message === 'TOKEN_INVALID') { liff.logout(); liff.login(); throw new Error('กำลังเข้าสู่ระบบใหม่...'); }
    return data;
  }

  async function main() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }

      idToken = liff.getIDToken();
      const profile = await liff.getProfile();
      $('name').textContent = profile.displayName;
      $('pic').src = profile.pictureUrl || '';

      const check = await api({ action: 'check' });
      if (check.registered) {
        $('studentId').value = check.studentId;
        $('status').textContent = 'ลงทะเบียนแล้ว (แก้ไขได้)';
        $('btn').textContent = 'บันทึกการแก้ไข';
      } else {
        $('status').textContent = 'ยังไม่ได้ลงทะเบียน';
      }
      $('btn').disabled = false;
    } catch (err) {
      showMsg('เกิดข้อผิดพลาด: ' + err.message, false);
    }
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('btn').disabled = true;
    $('btn').textContent = 'กำลังบันทึก...';
    try {
      const r = await api({ action: 'register', studentId: $('studentId').value.trim() });
      if (r.ok) {
        showMsg(r.updated ? 'แก้ไขรหัสนักศึกษาเรียบร้อย ✓' : 'ลงทะเบียนสำเร็จ ✓', true);
        $('status').textContent = 'ลงทะเบียนแล้ว';
        setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 2000);
      } else {
        showMsg(r.message, false);
      }
    } catch (err) {
      showMsg('เกิดข้อผิดพลาด: ' + err.message, false);
    }
    $('btn').disabled = false;
    $('btn').textContent = 'บันทึกการแก้ไข';
  });

  main();
</script>
</body>
</html>
